<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Access Control — JWT Auth Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --ink:#0A0F1C;
    --panel:#101828;
    --panel-2:#151F33;
    --line: rgba(230,234,242,0.09);
    --text:#E6EAF2;
    --text-dim:#8A93A6;
    --amber:#F2B705;
    --amber-dim: rgba(242,183,5,0.14);
    --cyan:#4CC9F0;
    --red:#FF6B6B;
    --green:#3DDC97;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--body);}
  #root{min-height:100vh;}
  ::selection{background:var(--amber);color:#0A0F1C;}

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(155deg, var(--amber), #C98A02);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:600;color:#0A0F1C;font-size:15px;
    box-shadow:0 0 0 1px rgba(242,183,5,0.35), 0 8px 20px -8px rgba(242,183,5,0.5);
  }
  .brand-text h1{
    font-family:var(--display);font-size:19px;margin:0;letter-spacing:0.2px;
  }
  .brand-text p{
    margin:2px 0 0;font-size:12.5px;color:var(--text-dim);font-family:var(--mono);
  }
  .badge{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:12px;
    padding:7px 12px;border-radius:20px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red);}

  /* ---------- Layout ---------- */
  .grid{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width: 880px){
    .grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .panel + .panel{margin-top:22px;}
  .panel h2{
    font-family:var(--display);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--text-dim);
    margin:0 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  .panel h2 .num{
    font-family:var(--mono);
    color:var(--amber);
    font-size:12px;
  }

  /* ---------- Form ---------- */
  label{
    display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-family:var(--mono);
  }
  input[type=text], input[type=password]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    outline:none;
    margin-bottom:16px;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--amber);}
  .field-err{border-color:var(--red) !important;}

  .storage-toggle{
    display:flex;gap:8px;margin-bottom:18px;
  }
  .storage-toggle button{
    flex:1;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    cursor:pointer;
  }
  .storage-toggle button.active{
    border-color:var(--cyan);
    color:var(--cyan);
    background:rgba(76,201,240,0.08);
  }

  button.primary{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:none;
    background:var(--amber);
    color:#0A0F1C;
    font-family:var(--display);
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    letter-spacing:0.2px;
  }
  button.primary:hover{filter:brightness(1.06);}
  button.primary:disabled{opacity:0.5;cursor:not-allowed;}
  button.ghost{
    width:100%;
    padding:11px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12.5px;
    cursor:pointer;
    margin-top:10px;
  }
  button.ghost:hover{border-color:var(--text-dim);color:var(--text);}
  button.danger{color:var(--red);border-color:rgba(255,107,107,0.3);}
  button.danger:hover{border-color:var(--red);}

  .hint{
    font-size:12px;color:var(--text-dim);font-family:var(--mono);
    line-height:1.6; margin-top:2px;
  }
  .err-msg{
    background:rgba(255,107,107,0.1);
    border:1px solid rgba(255,107,107,0.3);
    color:var(--red);
    padding:10px 12px;border-radius:8px;
    font-family:var(--mono);font-size:12.5px;
    margin-bottom:16px;
  }

  .creds-box{
    background:var(--panel-2);
    border:1px dashed var(--line);
    border-radius:9px;
    padding:12px 14px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .creds-box b{color:var(--text);}

  /* ---------- Session card ---------- */
  .session-card{
    border-radius:12px;
    padding:18px;
    border:1px solid var(--line);
    background:var(--panel-2);
  }
  .session-top{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;
  }
  .session-name{font-family:var(--display);font-size:17px;margin:0;}
  .session-role{font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:2px;}
  .pill{
    font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:20px;
    display:flex;align-items:center;gap:6px;
  }
  .pill.valid{background:rgba(61,220,151,0.12);color:var(--green);border:1px solid rgba(61,220,151,0.3);}
  .pill.expired{background:rgba(255,107,107,0.12);color:var(--red);border:1px solid rgba(255,107,107,0.3);}

  .kv{
    display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:12.5px;
    padding:7px 0;border-bottom:1px solid var(--line);
    color:var(--text-dim);
  }
  .kv b{color:var(--text);font-weight:500;}
  .kv:last-child{border-bottom:none;}

  /* ---------- Token strip (jwt.io style) ---------- */
  .token-strip{
    font-family:var(--mono);
    font-size:12px;
    line-height:1.9;
    word-break:break-all;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .seg-header{color:var(--cyan);}
  .seg-payload{color:var(--amber);}
  .seg-sig{color:var(--red);}
  .dot-sep{color:var(--text-dim);}

  .decode-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:640px){ .decode-grid{grid-template-columns:1fr;} }
  .decode-block{
    background:var(--panel-2);
    border-radius:10px;
    border:1px solid var(--line);
    padding:14px;
  }
  .decode-block .tag{
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;
    margin-bottom:8px;display:block;
  }
  .decode-block.h .tag{color:var(--cyan);}
  .decode-block.p .tag{color:var(--amber);}
  pre{
    margin:0;font-family:var(--mono);font-size:12px;color:var(--text);
    white-space:pre-wrap;word-break:break-word;
  }

  /* ---------- Flow ---------- */
  .flow{
    display:flex;flex-direction:column;gap:0;
  }
  .flow-step{
    display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);
  }
  .flow-step:last-child{border-bottom:none;}
  .flow-num{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11.5px;flex-shrink:0;
    border:1px solid var(--line);color:var(--text-dim);
    transition:all .2s;
  }
  .flow-step.done .flow-num{
    background:var(--green);border-color:var(--green);color:#0A0F1C;font-weight:700;
  }
  .flow-step.active .flow-num{
    background:var(--amber);border-color:var(--amber);color:#0A0F1C;font-weight:700;
    box-shadow:0 0 0 4px var(--amber-dim);
  }
  .flow-body b{display:block;font-size:13.5px;margin-bottom:2px;}
  .flow-body span{font-size:12px;color:var(--text-dim);}

  /* ---------- Console / request log ---------- */
  .console{
    background:#080C15;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    font-family:var(--mono);
    font-size:12px;
    max-height:230px;
    overflow-y:auto;
  }
  .console .line{padding:3px 0;color:var(--text-dim);}
  .console .line .ts{color:#4a5468;margin-right:8px;}
  .console .line.ok{color:var(--green);}
  .console .line.fail{color:var(--red);}
  .console .line.info{color:var(--cyan);}
  .console::-webkit-scrollbar{width:6px;}
  .console::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .actions-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .actions-row button{flex:1;min-width:160px;}

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--text-dim);
  }
  .empty-state .glyph{font-size:28px;margin-bottom:10px;opacity:0.6;}
  .empty-state p{font-family:var(--mono);font-size:12.5px;line-height:1.7;max-width:340px;margin:0 auto;}

  .foot-note{
    margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);
    border-top:1px solid var(--line);padding-top:16px;line-height:1.7;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- mock user directory (stand-in for a backend user store) ---------- */
const USERS = [
  { username: "admin",   password: "admin123",   name: "A. Sharma", role: "Administrator" },
  { username: "student", password: "student123", name: "R. Verma",  role: "Student" },
];

const SECRET = "lab-1.3.1-mock-server-secret"; // demo only — real secrets never live in client code
const TOKEN_TTL_SECONDS = 90; // short TTL so expiry is easy to observe during the lab

/* ---------- base64url + HMAC-SHA256 helpers (WebCrypto) ---------- */
function b64urlEncode(bytes) {
  let str = "";
  const arr = bytes instanceof Uint8Array ? bytes : new TextEncoder().encode(bytes);
  arr.forEach(b => str += String.fromCharCode(b));
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecodeToString(b64url) {
  let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  return atob(b64);
}
async function hmacSha256(message, secret) {
  const key = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(secret),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]
  );
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(message));
  return b64urlEncode(new Uint8Array(sig));
}

async function issueToken(user) {
  const header = { alg: "HS256", typ: "JWT" };
  const now = Math.floor(Date.now() / 1000);
  const payload = {
    sub: user.username,
    name: user.name,
    role: user.role,
    iat: now,
    exp: now + TOKEN_TTL_SECONDS,
  };
  const headerB64 = b64urlEncode(JSON.stringify(header));
  const payloadB64 = b64urlEncode(JSON.stringify(payload));
  const signingInput = `${headerB64}.${payloadB64}`;
  const signature = await hmacSha256(signingInput, SECRET);
  return { token: `${signingInput}.${signature}`, header, payload };
}

function decodeToken(token) {
  const parts = token.split(".");
  if (parts.length !== 3) return null;
  try {
    return {
      headerB64: parts[0],
      payloadB64: parts[1],
      sigB64: parts[2],
      header: JSON.parse(b64urlDecodeToString(parts[0])),
      payload: JSON.parse(b64urlDecodeToString(parts[1])),
    };
  } catch (e) {
    return null;
  }
}

/* verifies signature + expiry, as a resource server would on each request */
async function verifyToken(token) {
  const parts = token.split(".");
  if (parts.length !== 3) return { valid: false, reason: "Malformed token structure" };
  const [headerB64, payloadB64, sigB64] = parts;
  const expectedSig = await hmacSha256(`${headerB64}.${payloadB64}`, SECRET);
  if (expectedSig !== sigB64) return { valid: false, reason: "Signature mismatch — token has been tampered with" };
  let payload;
  try { payload = JSON.parse(b64urlDecodeToString(payloadB64)); }
  catch (e) { return { valid: false, reason: "Payload could not be decoded" }; }
  const now = Math.floor(Date.now() / 1000);
  if (payload.exp && now > payload.exp) return { valid: false, reason: "Token expired" };
  return { valid: true, payload };
}

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
}

/* ---------- main app ---------- */
function App() {
  const [storageType, setStorageType] = useState("sessionStorage");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [token, setToken] = useState(null);
  const [decoded, setDecoded] = useState(null);
  const [now, setNow] = useState(Math.floor(Date.now() / 1000));
  const [logs, setLogs] = useState([]);
  const [step, setStep] = useState(0); // 0 idle, 1 submitted, 2 validated, 3 issued, 4 stored
  const logIdRef = useRef(0);

  const pushLog = useCallback((msg, kind = "info") => {
    logIdRef.current += 1;
    setLogs(l => [...l.slice(-30), { id: logIdRef.current, msg, kind, t: new Date() }]);
  }, []);

  // tick for live expiry countdown
  useEffect(() => {
    const id = setInterval(() => setNow(Math.floor(Date.now() / 1000)), 1000);
    return () => clearInterval(id);
  }, []);

  // restore session on load (demonstrates stateless resume from stored token)
  useEffect(() => {
    const stores = [["sessionStorage", window.sessionStorage], ["localStorage", window.localStorage]];
    for (const [name, store] of stores) {
      const existing = store.getItem("jwt_lab_token");
      if (existing) {
        setStorageType(name);
        setToken(existing);
        setDecoded(decodeToken(existing));
        pushLog(`Restored existing token from ${name} on page load.`, "info");
        break;
      }
    }
    // eslint-disable-next-line
  }, []);

  const isExpired = decoded && decoded.payload.exp <= now;

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    const user = USERS.find(u => u.username === username);
    setStep(1);
    pushLog(`POST /login  { username: "${username}" }`, "info");
    await new Promise(r => setTimeout(r, 250)); // simulate network latency
    if (!user || user.password !== password) {
      setError("Invalid username or password.");
      pushLog("401 Unauthorized — credential check failed", "fail");
      setStep(0);
      return;
    }
    setStep(2);
    pushLog("Credentials validated against user store.", "ok");
    setBusy(true);
    try {
      const { token: newToken } = await issueToken(user);
      setStep(3);
      pushLog("HS256 JWT signed and issued by server.", "ok");
      const store = storageType === "localStorage" ? window.localStorage : window.sessionStorage;
      store.setItem("jwt_lab_token", newToken);
      setStep(4);
      pushLog(`Token persisted to ${storageType}.`, "ok");
      setToken(newToken);
      setDecoded(decodeToken(newToken));
      setPassword("");
    } catch (err) {
      setError("Token generation failed: " + err.message);
      pushLog("Token signing failed.", "fail");
      setStep(0);
    } finally {
      setBusy(false);
    }
  };

  const handleLogout = () => {
    window.localStorage.removeItem("jwt_lab_token");
    window.sessionStorage.removeItem("jwt_lab_token");
    setToken(null);
    setDecoded(null);
    setStep(0);
    pushLog("Client cleared token — session ended (server holds no session state).", "info");
  };

  const handleAccessResource = async () => {
    if (!token) return;
    pushLog(`GET /api/profile  Authorization: Bearer ${token.slice(0, 18)}…`, "info");
    await new Promise(r => setTimeout(r, 200));
    const result = await verifyToken(token);
    if (result.valid) {
      pushLog(`200 OK — access granted to "${result.payload.sub}" (${result.payload.role})`, "ok");
    } else {
      pushLog(`401 Unauthorized — ${result.reason}`, "fail");
    }
  };

  const handleTamper = () => {
    if (!token) return;
    const parts = token.split(".");
    // flip a character in the payload to simulate client-side tampering
    const chars = parts[1].split("");
    const idx = Math.min(3, chars.length - 1);
    chars[idx] = chars[idx] === "A" ? "B" : "A";
    const tampered = [parts[0], chars.join(""), parts[2]].join(".");
    setToken(tampered);
    setDecoded(decodeToken(tampered));
    const store = storageType === "localStorage" ? window.localStorage : window.sessionStorage;
    store.setItem("jwt_lab_token", tampered);
    pushLog("Payload byte flipped client-side to simulate tampering.", "fail");
  };

  const steps = [
    { label: "Submit credentials", detail: "Login form sends username + password" },
    { label: "Server validates user", detail: "Checked against the user store" },
    { label: "JWT generated", detail: "Header + payload signed with HS256" },
    { label: "Token stored client-side", detail: storageType },
    { label: "Ready for requests", detail: "Attach as Authorization: Bearer <token>" },
  ];

  return (
    <div className="wrap">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">JWT</div>
          <div className="brand-text">
            <h1>Access Control Lab</h1>
            <p>Experiment 1.3.1 — Stateless Authentication</p>
          </div>
        </div>
        <div className="badge">
          <span className={`dot ${token && !isExpired ? "on" : "off"}`}></span>
          {token && !isExpired ? "Session active" : "No active session"}
        </div>
      </div>

      <div className="grid">
        {/* LEFT: login + session control */}
        <div>
          <div className="panel">
            <h2><span className="num">01</span> Sign in</h2>

            {!token || isExpired ? (
              <form onSubmit={handleLogin}>
                <label>Username</label>
                <input
                  type="text" value={username}
                  onChange={e => setUsername(e.target.value)}
                  placeholder="admin"
                  className={error ? "field-err" : ""}
                  autoComplete="off"
                />
                <label>Password</label>
                <input
                  type="password" value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className={error ? "field-err" : ""}
                />

                <label>Token storage</label>
                <div className="storage-toggle">
                  <button type="button"
                    className={storageType === "sessionStorage" ? "active" : ""}
                    onClick={() => setStorageType("sessionStorage")}>
                    sessionStorage
                  </button>
                  <button type="button"
                    className={storageType === "localStorage" ? "active" : ""}
                    onClick={() => setStorageType("localStorage")}>
                    localStorage
                  </button>
                </div>

                {error && <div className="err-msg">{error}</div>}

                <button className="primary" type="submit" disabled={busy}>
                  {busy ? "Issuing token…" : "Log in"}
                </button>

                <div className="creds-box">
                  Mock accounts —<br/>
                  <b>admin / admin123</b> (Administrator)<br/>
                  <b>student / student123</b> (Student)
                </div>
              </form>
            ) : (
              <div className="session-card">
                <div className="session-top">
                  <div>
                    <p className="session-name">{decoded.payload.name}</p>
                    <p className="session-role">{decoded.payload.role}</p>
                  </div>
                  <span className={`pill ${isExpired ? "expired" : "valid"}`}>
                    <span className={`dot ${isExpired ? "off" : "on"}`}></span>
                    {isExpired ? "expired" : "valid"}
                  </span>
                </div>
                <div className="kv"><span>Subject (sub)</span><b>{decoded.payload.sub}</b></div>
                <div className="kv"><span>Issued at</span><b>{fmtTime(decoded.payload.iat)}</b></div>
                <div className="kv"><span>Expires at</span><b>{fmtTime(decoded.payload.exp)}</b></div>
                <div className="kv"><span>Time remaining</span>
                  <b style={{color: isExpired ? "var(--red)" : "var(--green)"}}>
                    {isExpired ? "0s" : `${Math.max(0, decoded.payload.exp - now)}s`}
                  </b>
                </div>
                <div className="kv"><span>Stored in</span><b>{storageType}</b></div>

                <div className="actions-row">
                  <button className="primary" onClick={handleAccessResource} disabled={isExpired}>
                    Call protected route
                  </button>
                </div>
                <button className="ghost" onClick={handleTamper} disabled={isExpired}>
                  Simulate tampering with token
                </button>
                <button className="ghost danger" onClick={handleLogout}>
                  Log out (clear token)
                </button>
              </div>
            )}
          </div>

          <div className="panel">
            <h2><span className="num">02</span> Conceptual flow</h2>
            <div className="flow">
              {steps.map((s, i) => (
                <div key={i} className={`flow-step ${step > i ? "done" : step === i + 1 ? "active" : ""}`}>
                  <div className="flow-num">{step > i ? "✓" : i + 1}</div>
                  <div className="flow-body">
                    <b>{s.label}</b>
                    <span>{s.detail}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* RIGHT: token inspector + console */}
        <div>
          <div className="panel">
            <h2><span className="num">03</span> Token inspector</h2>
            {token ? (
              <React.Fragment>
                <div className="token-strip">
                  <span className="seg-header">{decoded.headerB64}</span>
                  <span className="dot-sep">.</span>
                  <span className="seg-payload">{decoded.payloadB64}</span>
                  <span className="dot-sep">.</span>
                  <span className="seg-sig">{decoded.sigB64}</span>
                </div>
                <div className="decode-grid">
                  <div className="decode-block h">
                    <span className="tag">Header</span>
                    <pre>{JSON.stringify(decoded.header, null, 2)}</pre>
                  </div>
                  <div className="decode-block p">
                    <span className="tag">Payload (claims)</span>
                    <pre>{JSON.stringify(decoded.payload, null, 2)}</pre>
                  </div>
                </div>
                <p className="hint" style={{marginTop:14}}>
                  Signature = HMAC-SHA256(header + "." + payload, server secret). Re-computed on every
                  request to confirm the token wasn't altered after issue.
                </p>
              </React.Fragment>
            ) : (
              <div className="empty-state">
                <div className="glyph">◇</div>
                <p>No token issued yet. Log in on the left to generate a signed JWT and see it
                decoded here in real time.</p>
              </div>
            )}
          </div>

          <div className="panel">
            <h2><span className="num">04</span> Request / auth log</h2>
            <div className="console">
              {logs.length === 0 ? (
                <div className="line">Waiting for activity…</div>
              ) : logs.map(l => (
                <div key={l.id} className={`line ${l.kind}`}>
                  <span className="ts">{l.t.toLocaleTimeString([], { hour12: false })}</span>
                  {l.msg}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="foot-note">
        NOTE — this lab signs tokens with WebCrypto entirely in the browser so the HS256 signature,
        expiry, and tamper-detection are real and observable. In a production system the signing key
        never leaves the server: issuance and verification happen server-side, and the client only
        ever holds the opaque token.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
